name: share_bridge_wechat_ios
description: iOS federated implementation of share_bridge_wechat using WeChat OpenSDK callbacks and URL handling.
version: 0.1.0-dev.4
homepage: https://github.com/JamesGZM/flutter_share_bridge
repository: https://github.com/JamesGZM/flutter_share_bridge/tree/master/packages/share_bridge_wechat_ios
issue_tracker: https://github.com/JamesGZM/flutter_share_bridge/issues
topics:
  - flutter
  - share
  - wechat
  - ios
platforms:
  ios:

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  share_bridge_platform_interface: ^0.1.0-dev.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    implements: share_bridge_wechat
    platforms:
      ios:
        pluginClass: ShareBridgeWechatPlugin
        dartPluginClass: ShareBridgeWechatIOS
