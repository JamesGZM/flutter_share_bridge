name: share_bridge_qq_ohos
description: HarmonyOS federated implementation of share_bridge_qq using Tencent QQ OpenSDK signed sharing APIs.
version: 0.1.0-dev.3
homepage: https://github.com/JamesGZM/flutter_share_bridge
repository: https://github.com/JamesGZM/flutter_share_bridge/tree/master/packages/share_bridge_qq_ohos
issue_tracker: https://github.com/JamesGZM/flutter_share_bridge/issues
topics:
  - flutter
  - share
  - qq
  - harmonyos

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  share_bridge_platform_interface: ^0.1.0-dev.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    implements: share_bridge_qq
    platforms:
      ohos:
        package: com.gongziming.share_bridge_qq
        pluginClass: ShareBridgeQqPlugin
        dartPluginClass: ShareBridgeQqOhos
