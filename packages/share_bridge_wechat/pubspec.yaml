name: share_bridge_wechat
description: Share Bridge 的微信分享能力插件。
version: 0.1.0-dev.1
publish_to: none
repository: https://github.com/gongziming/flutter_share_bridge

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.10.0"

dependencies:
  flutter:
    sdk: flutter
  share_bridge_core:
    path: ../share_bridge_core
  share_bridge_wechat_android:
    path: ../share_bridge_wechat_android
  share_bridge_wechat_ios:
    path: ../share_bridge_wechat_ios
  share_bridge_platform_interface:
    path: ../share_bridge_platform_interface

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  plugin_platform_interface: ^2.0.2

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  plugin:
    platforms:
      android:
        default_package: share_bridge_wechat_android
      ios:
        default_package: share_bridge_wechat_ios
