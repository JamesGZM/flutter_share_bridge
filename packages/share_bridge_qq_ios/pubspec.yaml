name: share_bridge_qq_ios
description: iOS implementation of share_bridge_qq.
version: 0.1.0-dev.2
homepage: https://github.com/JamesGZM/flutter_share_bridge
repository: https://github.com/JamesGZM/flutter_share_bridge/tree/master/packages/share_bridge_qq_ios
issue_tracker: https://github.com/JamesGZM/flutter_share_bridge/issues
topics:
  - flutter
  - share
  - qq
  - ios
platforms:
