    sdk: flutter
  share_bridge_platform_interface: ^0.1.0-dev.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  plugin:
    implements: share_bridge_qq
    platforms:
      ios:
        pluginClass: ShareBridgeQqPlugin
        dartPluginClass: ShareBridgeQqIOS
